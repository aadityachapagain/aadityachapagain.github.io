name: Deploy Cloudflare Worker

on:
  push:
    branches: [source]
    paths:
      - 'api-worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-worker
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
          override: true

      - name: Cache Rust dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            worker/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Create wrangler.toml
        run: |
          cat > wrangler.toml << EOF
          name = "api-worker"
          type = "rust"
          workers_dev = false
          route = "api.aadityachapagain.com/v1/*"
          compatibility_date = "2023-05-07"
          
          # These values are set from GitHub secrets
          account_id = "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          zone_id = "${{ secrets.CLOUDFLARE_ZONE_ID }}"
          
          [vars]
          CONTACT_EMAIL_ADDRESS = "${{ secrets.CONTACT_EMAIL_ADDRESS }}"
          
          [build]
          command = "cargo install -q worker-build && worker-build --release"
          
          [build.upload]
          format = "modules"
          main = "./worker/shim.mjs"
          
          [miniflare]
          modules = true
          EOF

      # Create a modern JS shim file
      - name: Create shim.mjs
        run: |
          mkdir -p ./worker
          cat > ./worker/shim.mjs << EOF
          import { wasm } from './shim.wasm';

          // Create a module that exports a fetch handler
          export default {
            async fetch(request, env, ctx) {
              return await wasm.fetch(request, env, ctx);
            }
          };
          EOF

      - name: Create custom build script
        run: |
          cat > build-worker.sh << EOF
          #!/bin/bash
          set -e

          # Install worker-build if not already installed
          cargo install -q worker-build
          
          # Build the Rust project
          worker-build --release
          
          # Create necessary directories
          mkdir -p ./worker
          
          # Copy the WASM file
          cp ./build/worker.wasm ./worker/shim.wasm
          
          # Show success message
          echo "Build completed successfully"
          EOF
          
          chmod +x build-worker.sh

      - name: Build worker
        run: ./build-worker.sh

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@3.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: 'worker'
          command: publish
          preCommands: |
            echo "Using Node version: $(node -v)"
            echo "Using Wrangler version: $(wrangler -v)"
          secrets: |
            DISCORD_EMAIL_WEBHOOK_URL
            SMTP_API_KEY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DISCORD_EMAIL_WEBHOOK_URL: ${{ secrets.DISCORD_EMAIL_WEBHOOK_URL }}
          SMTP_API_KEY: ${{ secrets.SMTP_API_KEY }}