name: Deploy Cloudflare Worker

on:
  push:
    branches: [source]
    paths:
      - 'api-worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-worker
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
          override: true

      - name: Cache Rust dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            api-worker/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Create deployment directory
        run: mkdir -p dist

      - name: Create wrangler.toml
        run: |
          cat > wrangler.toml << EOF
          name = "api-worker"
          main = "./dist/index.js"
          compatibility_date = "2023-05-07"
          
          routes = [
            { pattern = "api.aadityachapagain.com/v1/*", zone_name = "aadityachapagain.com" }
          ]
          
          # These values are set from GitHub secrets
          account_id = "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          
          [vars]
          CONTACT_EMAIL_ADDRESS = "contact@aadityachapagain.com"
          
          [build]
          command = "cargo install -q worker-build && worker-build --release"
          
          [build.upload]
          format = "modules"
          EOF

      - name: Build with worker-build
        run: |
          # Install worker-build if not already installed
          cargo install -q worker-build
          
          # Build the Rust project
          worker-build --release
          
          # List build directory contents for debugging
          echo "Build directory contents:"
          ls -la build/
          
          # Find the wasm file - name might vary
          WASM_FILE=$(find build -name "*.wasm" | head -1)
          echo "Found WASM file: $WASM_FILE"
          
          # Create dist directory and copy files
          mkdir -p dist
          cp $WASM_FILE dist/worker.wasm
          
          # Create the JavaScript wrapper
          cat > dist/index.js << EOF
          import worker from './worker.wasm';
          
          export default {
            async fetch(request, env, ctx) {
              return await worker.fetch(request, env, ctx);
            }
          };
          EOF
          
          # List dist directory contents for verification
          echo "Dist directory contents:"
          ls -la dist/

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@3.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: 'api-worker'
          command: publish --compatibility-date 2023-05-07
          preCommands: |
            echo "Using Node version: $(node -v)"
            echo "Using Wrangler version: $(wrangler -v)"
          secrets: |
            DISCORD_EMAIL_WEBHOOK_URL
            SMTP_API_KEY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DISCORD_EMAIL_WEBHOOK_URL: ${{ secrets.DISCORD_EMAIL_WEBHOOK_URL }}
          SMTP_API_KEY: ${{ secrets.SMTP_API_KEY }}